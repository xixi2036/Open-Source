[package]
name = "hushcore"
version = "0.1.0"
edition = "2021"
description = "Hush 加密社交 App 客户端核心库（UniFFI）"
license = "Proprietary"
publish = false

[lib]
name = "hushcore"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
vodozemac = { version = "0.11", features = ["experimental-session-config"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
url = "2"

[features]
# 测试注入与调试接口（HushClient::debug_*、故障注入、最近信封记录等），供 tests/e2e.rs 使用；
# 发布构建与生成绑定时不启用。下方的自引用 dev-dependency 让 cargo test / 示例构建自动打开它。
test-hooks = []

[dev-dependencies]
hushcore = { path = ".", features = ["test-hooks"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
